<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MB Diagnostics & Coding | Mobile Mercedes Specialist</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background-color: #111; color: #fff; line-height: 1.6; }
        
        /* Premium Hero Banner Styling with Cache Buster */
        .hero-banner { 
            position: relative;
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.85)), url('cls-hero.jpg?v=2') no-repeat center center; 
            background-size: cover; 
            height: 450px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            padding: 20px;
            border-bottom: 2px solid #333;
        }
        
        h1 { margin: 0; color: #fff; font-size: 2.8rem; letter-spacing: 2px; font-weight: 800; text-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        .tagline { color: #ccc; font-size: 1.3rem; margin-top: 12px; font-weight: 300; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
        .location-badge { display: inline-block; background: rgba(17, 17, 17, 0.85); border: 1px solid #444; padding: 8px 20px; border-radius: 20px; font-size: 0.95rem; color: #00ff66; margin-top: 20px; font-weight: bold; backdrop-filter: blur(5px); }
        
        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
        .services { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: #1a1a1a; border-radius: 8px; border: 1px solid #333; text-align: center; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
        .card-content { padding: 25px; display: flex; flex-direction: column; height: 100%; justify-content: space-between; }
